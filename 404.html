<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina non trovata — MLP Studio Creativo</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,200;0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0a0a0a;--muted:#7a7a7a;--paper:#ffffff;--line:#e6e6e6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito Sans',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:300;font-size:16px;line-height:1.6;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  header{padding:18px 32px;border-bottom:1px solid var(--line)}
  header img{height:22px;width:auto;display:block}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:760px;margin:0 auto;padding:80px 24px;width:100%}
  .kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:24px}
  h1{font-family:'Avenir Light','Avenir Next','Avenir','Nunito Sans',sans-serif;font-weight:300;font-size:clamp(2.4rem,6vw,4.2rem);letter-spacing:-.03em;line-height:1.05;margin-bottom:24px}
  p{color:var(--muted);margin-bottom:40px;max-width:520px}
  nav{display:flex;flex-wrap:wrap;gap:14px}
  nav a{font-size:11px;letter-spacing:.25em;text-transform:uppercase;padding:16px 26px;border:1px solid var(--ink);transition:background .25s,color .25s}
  nav a.primary{background:var(--ink);color:#fff}
  nav a:hover{background:var(--ink);color:#fff}
  nav a.primary:hover{background:#1a1a1a}
  footer{padding:24px 32px;border-top:1px solid var(--line);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<header><a href="/"><img src="/logo.svg" alt="MLP Studio Creativo"></a></header>
<main>
  <div class="kicker">Errore 404</div>
  <h1>Pagina non trovata</h1>
  <p>L'indirizzo che cerchi non esiste più o è stato spostato. Da qui puoi tornare al sito.</p>
  <nav>
    <a class="primary" href="/">Home</a>
    <a href="/services.html">Servizi</a>
    <a href="/call-strategica/">Call strategica</a>
  </nav>
</main>
<footer>MLP Studio Creativo · San Donà di Piave (Venezia)</footer>
</body>
</html>
